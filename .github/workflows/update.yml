name: Refresh prices

on:
  schedule:
    # GitHub starts scheduled runs hours late, so look several times.
    # The first run after the US close publishes it; later runs find
    # nothing new and stop. Minute 37 avoids the top-of-hour rush.
    - cron: "37 21,23 * * 1-5"
    - cron: "37 2,5,8,11 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update series
        run: |
          code=0
          python3 update.py --require-new-day || code=$?
          if [ "$code" -eq 75 ]; then
            echo "no new completed day yet; the next scheduled run will look again"
            exit 0
          fi
          exit "$code"
      - name: Publish if the series changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series.json data/series.csv index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update daily closes"
          git push
