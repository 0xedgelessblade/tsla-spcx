name: Refresh prices

on:
  schedule:
    # 08:17 UTC, Tuesday–Saturday. First look is after Yahoo has had the
    # night to publish the US cash close. GitHub may start this late.
    - cron: "17 8 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update series, then retry hourly while the new day is missing
        run: |
          python3 update.py --require-new-day
          code=$?
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          if [ "$code" -ne 75 ]; then
            exit "$code"
          fi
          # Stop at the next 13:30 UTC, before the next session can open.
          # 13:30 UTC is 09:30 in New York during summer, and 08:30 in winter.
          now=$(date -u +%s)
          deadline=$(date -u -d '13:30 UTC' +%s)
          if [ "$deadline" -le "$now" ]; then
            deadline=$(date -u -d 'tomorrow 13:30 UTC' +%s)
          fi
          while [ "$(date -u +%s)" -lt "$deadline" ]; do
            echo "new day not published yet; waiting 1 hour"
            sleep 3600
            python3 update.py --require-new-day
            code=$?
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if [ "$code" -ne 75 ]; then
              exit "$code"
            fi
          done
          echo "still no new completed day before the next open; leaving the saved series unchanged"
          exit 1
      - name: Publish if the series changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series.json data/series.csv
          git diff --cached --quiet && exit 0
          git commit -m "Update daily closes"
          git push
